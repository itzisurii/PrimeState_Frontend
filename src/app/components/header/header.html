<header
    class="flex h-20 items-center justify-between bg-white px-8 sticky top-0 z-30 shadow-sm border-b border-slate-100">
    <div>
        <h2 class="text-xl font-bold text-slate-900 tracking-tight">Agent Dashboard</h2>
        <div class="flex items-center gap-2 text-xs text-slate-500 font-medium mt-0.5">
            <span class="material-symbols-outlined text-[14px] text-primary">location_on</span>
            <span>Dubai, UAE</span>
            <span class="h-1 w-1 rounded-full bg-slate-300"></span>
            <span>Oct 25, 2023</span>
        </div>
    </div>
    <div class="flex items-center gap-6">
        <div class="hidden md:flex relative group">
            <span class="absolute left-3 top-2.5 text-slate-400 material-symbols-outlined text-[20px]">search</span>
            <input
                class="h-10 w-80 rounded-full border border-slate-200 bg-slate-50 pl-10 pr-4 text-sm text-slate-700 focus:bg-white focus:border-primary focus:ring-0 transition-all placeholder-slate-400"
                placeholder="Search properties, leads, or addresses..." type="text" />
        </div>
        <div class="h-8 w-px bg-slate-200 mx-2"></div>
        <button
            class="relative flex h-10 w-10 items-center justify-center rounded-full text-slate-400 hover:bg-slate-50 hover:text-primary transition-colors">
            <span class="material-symbols-outlined">notifications</span>
            <span class="absolute top-2.5 right-2.5 h-2 w-2 rounded-full bg-primary ring-2 ring-white"></span>
        </button>
    </div>
</header>
